name: Themes Issue (all themes)

# 全量：所有 themes 的日更/index 自动建/更新 issue（原 btc/market-daily 白名单已扩至全量）
# 逻辑同 hn-daily-issue.yml：重跑更新而非跳过；hn-daily 仍由专属工作流处理，此处去重
on:
  push:
    paths:
      - 'themes/**/*.md'
  workflow_dispatch:

permissions:
  issues: write

jobs:
  create-or-update-issue:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find changed theme files
        id: find
        run: |
          # 取本次 push 中变更的所有 theme 文件（排除 _history；hn-daily 由专属工作流处理，此处跳过以免重复）
          if [ "${{ github.event_name }}" = "push" ]; then
            BEFORE="${{ github.event.before }}"
            AFTER="${{ github.sha }}"
            if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
              FILES=$(ls themes/*/index.md themes/*/2*.md 2>/dev/null | grep -v "/_history/" | grep -v "hn-daily" | sort | tail -10)
            else
              FILES=$(git diff --name-only "$BEFORE" "$AFTER" 2>/dev/null | grep -E '^themes/[^/]+/(index\.md|[0-9]{4}-[0-9]{2}-[0-9]{2}\.md)$' | grep -v "hn-daily" || true)
              [ -z "$FILES" ] && FILES=$(ls themes/*/index.md themes/*/2*.md 2>/dev/null | grep -v "/_history/" | grep -v "hn-daily" | sort | tail -1)
            fi
          else
            FILES=$(ls themes/*/index.md themes/*/2*.md 2>/dev/null | grep -v "/_history/" | grep -v "hn-daily" | sort | tail -1)
          fi
          echo "files<<EOF" >> "$GITHUB_OUTPUT"
          echo "$FILES" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
          echo "found: $FILES"

      - name: Create or update issues
        if: steps.find.outputs.files != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "${{ steps.find.outputs.files }}" | while read -r FILE; do
            [ -z "$FILE" ] && continue
            [ ! -f "$FILE" ] && continue
            if [ "$(basename "$FILE")" = "index.md" ]; then
              DATE=$(grep -E '^updated:' "$FILE" | head -1 | sed -E 's/.*([0-9]{4}-[0-9]{2}-[0-9]{2}).*/\1/' || true)
              [ -z "$DATE" ] && DATE=$(date +%Y-%m-%d)
            else
              DATE=$(basename "$FILE" .md)
            fi
            SLUG=$(echo "$FILE" | cut -d'/' -f2)
            case "$SLUG" in
              btc) TITLE="BTC · $DATE" ;;
              market-daily) TITLE="Market Daily · $DATE" ;;
              justin-sun) TITLE="Justin Sun · $DATE" ;;
              fed) TITLE="Fed · $DATE" ;;
              *) TITLE="$SLUG · $DATE" ;;
            esac
            EXISTING=$(gh issue list --repo jazzqi/deep-thought-research --search "in:title \"$TITLE\" is:issue" --limit 1 --json number 2>/dev/null | python3 -c "import json,sys; d=json.load(sys.stdin); print(d[0]['number'] if d else '')" 2>/dev/null)
            awk 'BEGIN{fm=0} /^---[[:space:]]*$/ {fm++; next} fm>=2{print}' "$FILE" > /tmp/body.md
            printf '\n---\n📄 仓库内原文：[%s](https://github.com/jazzqi/deep-thought-research/blob/main/%s)\n' "$DATE" "$FILE" >> /tmp/body.md
            if [ -n "$EXISTING" ]; then
              echo "Updating issue #$EXISTING for $TITLE"
              gh issue edit "$EXISTING" --body-file /tmp/body.md --repo jazzqi/deep-thought-research
            else
              echo "Creating issue for $TITLE"
              gh issue create --title "$TITLE" --body-file /tmp/body.md --assignee jazzqi --repo jazzqi/deep-thought-research
            fi
          done
search
            fi
          done

name: HN Daily Issue

# 触发：① 推送 themes/hn-daily/*.md（cron flow 报告落盘后自动建 issue）
#       ② 手动 dispatch（试验/补发）
on:
  push:
    paths:
      - 'themes/hn-daily/*.md'
  workflow_dispatch:

permissions:
  issues: write

jobs:
  create-issue:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find latest HN daily report
        id: find
        run: |
          # 取最新的 themes/hn-daily/YYYY-MM-DD.md
          LATEST=$(ls themes/hn-daily/2*.md 2>/dev/null | sort | tail -1)
          echo "latest=$LATEST"
          echo "file=$LATEST" >> "$GITHUB_OUTPUT"

      - name: Create issue with full report
        if: steps.find.outputs.file != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          FILE="${{ steps.find.outputs.file }}"
          DATE=$(basename "$FILE" .md)
          # 防重：同日期 issue 已存在则跳过（避免重复建多个）
          TITLE="HN 书摘 · $DATE"
          EXISTING=$(gh issue list --repo jazzqi/deep-thought-research \
            --search "in:title \"$TITLE\" is:issue" --limit 1 --json number 2>/dev/null \
            | python3 -c "import json,sys; d=json.load(sys.stdin); print(d[0]['number'] if d else '')" 2>/dev/null)
          if [ -n "$EXISTING" ]; then
            echo "issue #$EXISTING already exists for $DATE, updating."
            gh issue edit "$EXISTING" --body-file /tmp/body.md --repo jazzqi/deep-thought-research
            echo "issue #$EXISTING updated."
            exit 0
          fi
          # 剥离 frontmatter：删除开头第一个 --- 到第二个 ---（含），保留正文
          # awk 逐行处理：跳过前两条 --- 分隔线后开始输出
          awk '
            BEGIN { fm = 0 }
            /^---[[:space:]]*$/ { fm++; next }
            fm >= 2 { print }
          ' "$FILE" > /tmp/body.md
          # 文末追加仓库原文链接
          printf '\n---\n📄 仓库内原文：[%s](https://github.com/jazzqi/deep-thought-research/blob/main/%s)\n' "$DATE" "$FILE" >> /tmp/body.md
          gh issue create \
            --title "$TITLE" \
            --body-file /tmp/body.md \
            --assignee jazzqi \
            --repo jazzqi/deep-thought-research
